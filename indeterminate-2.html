<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Indeterminate Progress Indicator - 2</title>
  <link rel="stylesheet" href="indeterminate-2.css">
</head>
<body>
  <main>
    <div class="stage" aria-label="Indeterminate Progress Indicator - 2">
      <div class="cluster">
        <div class="tile corner" style="grid-area: nw;"></div>
        <div class="tile arm" style="grid-area: n;"></div>
        <div class="tile corner" style="grid-area: ne;"></div>
        <div class="tile arm" style="grid-area: w;"></div>
        <div class="tile arm core" style="grid-area: c;"></div>
        <div class="tile arm" style="grid-area: e;"></div>
        <div class="tile corner" style="grid-area: sw;"></div>
        <div class="tile arm" style="grid-area: s;"></div>
        <div class="tile corner" style="grid-area: se;"></div>
        <svg class="links" viewBox="0 0 3 3">
          <path class="wire" d="M1.5,1.5 Q1.75,1.0 1.5,0.5"></path>
          <path class="wire thin" d="M1.5,1.5 Q1.3,1.05 1.5,0.5"></path>
          <path class="wire" d="M1.5,1.5 Q1.0,1.25 0.5,1.5"></path>
          <path class="wire thin" d="M1.5,1.5 Q1.05,1.7 0.5,1.5"></path>
          <path class="wire" d="M1.5,1.5 Q2.0,1.75 2.5,1.5"></path>
          <path class="wire thin" d="M1.5,1.5 Q1.95,1.3 2.5,1.5"></path>
          <path class="wire" d="M1.5,1.5 Q1.25,2.0 1.5,2.5"></path>
          <path class="wire thin" d="M1.5,1.5 Q1.7,1.95 1.5,2.5"></path>
        </svg>
      </div>
    </div>
  </main>
</body>
</html>
