<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Indeterminate Progress Indicator - 2</title>
  <link rel="stylesheet" href="indeterminate-2.css">
</head>
<body>
  <main>
    <div class="stage" aria-label="Indeterminate Progress Indicator - 2">
      <div class="cluster">
        <div class="tile corner" style="grid-area: nw;"></div>
        <div class="tile arm" style="grid-area: n;"></div>
        <div class="tile corner" style="grid-area: ne;"></div>
        <div class="tile arm" style="grid-area: w;"></div>
        <div class="tile arm core" style="grid-area: c;"></div>
        <div class="tile arm" style="grid-area: e;"></div>
        <div class="tile corner" style="grid-area: sw;"></div>
        <div class="tile arm" style="grid-area: s;"></div>
        <div class="tile corner" style="grid-area: se;"></div>
        <svg class="links" viewBox="0 0 3 3" preserveAspectRatio="none">
          <line x1="1.5" y1="0.5" x2="1.5" y2="1.5"></line>
          <line x1="0.5" y1="1.5" x2="1.5" y2="1.5"></line>
          <line x1="1.5" y1="1.5" x2="2.5" y2="1.5"></line>
          <line x1="1.5" y1="1.5" x2="1.5" y2="2.5"></line>
        </svg>
      </div>
    </div>
  </main>
</body>
</html>
