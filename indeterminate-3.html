<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Indeterminate Progress Indicator - 3</title>
  <link rel="stylesheet" href="indeterminate-3.css">
</head>
<body>
  <main>
    <div class="slider" aria-label="Indeterminate Progress Indicator - 3">
      <div class="marker">
        <div class="marker-pin">
          <svg class="pin-stem" width="2" height="29" viewBox="0 0 2 29" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M1 1L1 28" stroke="#FF874F" stroke-width="0.5"/>
            <path d="M1 27L1.86603 28.5H0.133975L1 27Z" fill="#FF874F"/>
            <path d="M1 2L0.133975 0.5H1.86603L1 2Z" fill="#FF874F"/>
          </svg>
          <svg class="pin-dot" width="15" height="15" viewBox="0 0 15 15" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="7.5" cy="7.5" r="7" fill="black" stroke="black"/>
            <circle cx="3.5" cy="6.5" r="0.5" fill="white"/>
            <circle cx="6.5" cy="6.5" r="0.5" fill="white"/>
          </svg>
        </div>
      </div>
      <div class="track">
        <div class="segment">
          <div class="dashes">
            <svg width="12" height="2" viewBox="0 0 12 2" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="1" cy="1" r="1" fill="#FF874F"/><circle cx="6" cy="1" r="1" fill="#FF874F"/><circle cx="11" cy="1" r="1" fill="#FF874F"/></svg>
            <svg width="12" height="2" viewBox="0 0 12 2" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="1" cy="1" r="1" fill="#FF874F"/><circle cx="6" cy="1" r="1" fill="#FF874F"/><circle cx="11" cy="1" r="1" fill="#FF874F"/></svg>
            <svg width="12" height="2" viewBox="0 0 12 2" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="1" cy="1" r="1" fill="#FF874F"/><circle cx="6" cy="1" r="1" fill="#FF874F"/><circle cx="11" cy="1" r="1" fill="#FF874F"/></svg>
            <svg width="12" height="2" viewBox="0 0 12 2" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="1" cy="1" r="1" fill="#FF874F"/><circle cx="6" cy="1" r="1" fill="#FF874F"/><circle cx="11" cy="1" r="1" fill="#FF874F"/></svg>
            <svg width="12" height="2" viewBox="0 0 12 2" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="1" cy="1" r="1" fill="#FF874F"/><circle cx="6" cy="1" r="1" fill="#FF874F"/><circle cx="11" cy="1" r="1" fill="#FF874F"/></svg>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
